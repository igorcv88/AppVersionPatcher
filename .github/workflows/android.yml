name: Build signed release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-version-patcher-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing KEY_PASSWORD"; exit 1; }

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/app-version-patcher.keystore"
          chmod 600 "$RUNNER_TEMP/app-version-patcher.keystore"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/app-version-patcher.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare and verify APK
        id: apk
        run: |
          METADATA="app/build/outputs/apk/release/output-metadata.json"
          VERSION_NAME="$(python3 -c 'import json; print(json.load(open("'"$METADATA"'"))["elements"][0]["versionName"])')"
          VERSION_CODE="$(python3 -c 'import json; print(json.load(open("'"$METADATA"'"))["elements"][0]["versionCode"])')"
          OUTPUT_FILE="$(python3 -c 'import json; print(json.load(open("'"$METADATA"'"))["elements"][0]["outputFile"])')"
          SOURCE_APK="app/build/outputs/apk/release/$OUTPUT_FILE"
          RELEASE_APK="$RUNNER_TEMP/AppVersionPatcher.apk"

          cp "$SOURCE_APK" "$RELEASE_APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$RELEASE_APK"

          echo "path=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Publish rolling GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          VERSION_NAME: ${{ steps.apk.outputs.version_name }}
          VERSION_CODE: ${{ steps.apk.outputs.version_code }}
        run: |
          TAG="latest"
          TITLE="App Version Patcher v${VERSION_NAME}"
          NOTES="Signed APK built from commit ${GITHUB_SHA}. Android versionCode: ${VERSION_CODE}."

          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest
            gh release upload "$TAG" "${APK_PATH}#AppVersionPatcher.apk" --clobber
          else
            gh release create "$TAG" "${APK_PATH}#AppVersionPatcher.apk" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest
          fi
